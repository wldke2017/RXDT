    <text x="0" y="75" fill="url(#cyanGrad)" font-family="'Outfit', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" letter-spacing="1">PASSIVE MONTHLY SALARY REWARDS</text>
    <text x="0" y="105" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Empowering Team Leaders with Continuous, Multi-Tiered Long-Term Wealth</text>
