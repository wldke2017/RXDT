    <text x="35" y="98" fill="#00f2fe" font-family="sans-serif" font-weight="700" font-size="15">👉 Join &amp; Register: https://www.rxdt.site/#/register?invite=RXN2ZO</text>

    <!-- Right Badge / VIP Salary Highlight -->
    <g transform="translate(810, 20)">
      <rect width="235" height="90" rx="12" fill="url(#goldGrad)" />
      <text x="117" y="36" text-anchor="middle" fill="#000000" font-family="sans-serif" font-weight="900" font-size="15">VIP 1 – VIP 9 SALARIES</text>
      <text x="117" y="66" text-anchor="middle" fill="#000000" font-family="sans-serif" font-weight="900" font-size="24">$90 – $9,000 / mo</text>
