  <!-- Card 5 -->
  <g transform="translate(427, 335)">
    <rect width="345" height="135" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 226, 89, 0.3)" stroke-width="1" />
    <circle cx="40" cy="40" r="18" fill="rgba(255, 226, 89, 0.2)" stroke="#ffe259" stroke-width="1.5" />
