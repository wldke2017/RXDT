<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Warm dark gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09060f" />
      <stop offset="45%" stop-color="#130a1a" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>

    <!-- Warm gold/orange gradient -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7971e" />
      <stop offset="100%" stop-color="#ffd200" />
    </linearGradient>

    <!-- Coral/heart gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c" />
      <stop offset="100%" stop-color="#ff4b2b" />
    </linearGradient>

    <!-- Cyan RXDT brand gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Card BG -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30,15,8,0.9)" />
      <stop offset="100%" stop-color="rgba(10,6,3,0.97)" />
    </linearGradient>

    <!-- Warm glow -->
    <filter id="glowWarm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowHeart" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- ─── Background ─── -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#f7971e" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Warm background orbs -->
  <circle cx="120" cy="220" r="200" fill="#f7971e" opacity="0.09" filter="url(#glowWarm)"/>
  <circle cx="1080" cy="460" r="180" fill="#ff416c" opacity="0.08" filter="url(#glowHeart)"/>
  <circle cx="600" cy="650" r="140" fill="#ffd200" opacity="0.06" filter="url(#glowWarm)"/>

  <!-- ─── TOP HEADER BAR ─── -->
  <rect x="0" y="0" width="1200" height="80" fill="rgba(0,0,0,0.5)"/>
  <!-- RXDT badge -->
  <rect x="40" y="20" width="110" height="40" rx="8" fill="rgba(0,242,254,0.15)" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="95" y="45" text-anchor="middle" fill="#00f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="17" letter-spacing="3">RXDT</text>
  <!-- Title -->
  <text x="170" y="50" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" letter-spacing="1">EXCHANGE  —  COMMUNITY OUTREACH</text>
  <!-- Right date tag -->
  <rect x="1010" y="20" width="160" height="38" rx="8" fill="rgba(247,151,30,0.15)" stroke="#f7971e" stroke-width="1.2"/>
  <text x="1090" y="43" text-anchor="middle" fill="#ffd200" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Est. 30 JULY 2026</text>

  <!-- ─── MAIN HERO HEADLINE ─── -->
  <text x="600" y="135" text-anchor="middle" fill="url(#warmGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" filter="url(#shadow)" letter-spacing="1">RXDT COMMUNITY GIVES BACK 🌍❤️</text>
  <text x="600" y="168" text-anchor="middle" fill="#e2c8a0" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" letter-spacing="0.3">Charity Visit · Children's Home · Acts of Kindness</text>

  <!-- ─── DIVIDER ─── -->
  <line x1="60" y1="188" x2="1140" y2="188" stroke="url(#warmGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- ─── 3 STORY CARDS ─── -->
  <!-- Card 1: The Visit -->
  <g transform="translate(55, 205)">
    <rect width="340" height="210" rx="16" fill="url(#cardGrad)" stroke="rgba(247,151,30,0.35)" stroke-width="1.2"/>
    <!-- Icon circle -->
    <circle cx="50" cy="50" r="28" fill="rgba(247,151,30,0.18)" stroke="#f7971e" stroke-width="1.5"/>
    <text x="50" y="60" text-anchor="middle" font-size="26">🏠</text>
    <text x="92" y="44" fill="#ffd200" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15">Children's Home Visit</text>
    <text x="92" y="62" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Team Leaders Organized</text>
    <!-- Body text lines -->
    <text x="20" y="105" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">Our community leaders arranged a</text>
    <text x="20" y="123" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">heartfelt visit — donating essential</text>
    <text x="20" y="141" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">supplies to meet the children's</text>
    <text x="20" y="159" fill="#ffd200" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">daily needs. ✅</text>
  </g>

  <!-- Card 2: The Moments -->
  <g transform="translate(430, 205)">
    <rect width="340" height="210" rx="16" fill="url(#cardGrad)" stroke="rgba(255,65,108,0.35)" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="28" fill="rgba(255,65,108,0.18)" stroke="#ff416c" stroke-width="1.5"/>
    <text x="50" y="60" text-anchor="middle" font-size="26">💞</text>
    <text x="92" y="44" fill="#ff8fa3" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15">Shared Joyful Moments</text>
    <text x="92" y="62" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">More Than Donations</text>
    <text x="20" y="105" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">Our members chatted, played and</text>
    <text x="20" y="123" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">laughed with the children — creating</text>
    <text x="20" y="141" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">memories that matter far beyond</text>
    <text x="20" y="159" fill="#ff8fa3" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">any material gift. 💛</text>
  </g>

  <!-- Card 3: The Mission -->
  <g transform="translate(805, 205)">
    <rect width="340" height="210" rx="16" fill="url(#cardGrad)" stroke="rgba(0,242,254,0.3)" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="28" fill="rgba(0,242,254,0.15)" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="50" y="60" text-anchor="middle" font-size="26">🌍</text>
    <text x="92" y="44" fill="#00f2fe" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15">A Community Mission</text>
    <text x="92" y="62" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Online &amp; On the Ground</text>
    <text x="20" y="105" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">Since July 30, 2026, RXDT under</text>
    <text x="20" y="123" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">founder Arthur Vance has pledged</text>
    <text x="20" y="141" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">to create positive impact — in</text>
    <text x="20" y="159" fill="#00f2fe" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">markets and in lives. 🚀</text>
  </g>

  <!-- ─── QUOTE BANNER ─── -->
  <g transform="translate(55, 438)">
    <rect width="1090" height="78" rx="14" fill="rgba(247,151,30,0.07)" stroke="url(#warmGrad)" stroke-width="1.5"/>
    <!-- Left quote marks -->
    <text x="22" y="55" fill="#f7971e" font-family="Georgia, serif" font-size="58" opacity="0.4">"</text>
    <text x="105" y="58" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" font-style="italic">Working together, growing together, giving back to society.</text>
    <text x="820" y="50" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">— RXDT Community Motto</text>
    <!-- Right quote marks -->
    <text x="1058" y="68" fill="#f7971e" font-family="Georgia, serif" font-size="58" opacity="0.4">"</text>
  </g>

  <!-- ─── BOTTOM CTA FOOTER ─── -->
  <g transform="translate(55, 535)">
    <rect width="1090" height="108" rx="16" fill="rgba(0,0,0,0.5)" stroke="url(#cyanGrad)" stroke-width="1.5"/>

    <!-- Heart icon + tagline -->
    <text x="35" y="44" fill="url(#warmGrad)" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20">❤️ JOIN A COMMUNITY THAT EARNS, CARES AND GROWS TOGETHER</text>
    <text x="35" y="68" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14">Arthur Vance · Founder &amp; CEO | Launched 30th July 2026 | USA Colorado State Compliant</text>
    <text x="35" y="92" fill="#00f2fe" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15">👉 Register: https://www.rxdt.site/#/register?invite=RXN2ZO  |  📬 @RXDT888</text>
  </g>
</svg>
